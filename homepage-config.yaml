# Homepage Glances Widget 配置示例
#
# 将以下配置片段添加到你的 Homepage 配置中
# =====================================================

# =====================================================
# 方式1：Info Widget（在 widgets.yaml 中）
# =====================================================
# 这是你要的效果 — 类似内置 resources info 面板
# 显示 CPU%、Mem%、Swap%、CPU型号、系统版本
#
# 添加到 Homepage 的 widgets 配置区域的 - widgets 部分：

- glances:
    url: http://your-server-ip:32518
    cpu: true          # 显示CPU使用率（默认true）
    mem: true          # 显示内存使用率（默认true）
    expanded: false     # false=紧凑模式（和截图效果一致）
    label: iCloud325   # 可选，自定义标签名


# =====================================================
# 方式2：Service Widget（在 services.yaml 中）
# =====================================================
# 如果你想单独展示某个指标（带图表），用 service widget
# 这些放在 services.yaml 的 - service 列表里

# --- CPU 图表 ---
- CPU:
    widget:
      type: glances
      url: http://your-server-ip:32518
      metric: cpu

# --- 内存 图表 ---
- Memory:
    widget:
      type: glances
      url: http://your-server-ip:32518
      metric: memory

# --- 系统信息面板（紧凑模式）---
- System Info:
    widget:
      type: glances
      url: http://your-server-ip:32518
      metric: info
      chart: false

# --- 根分区磁盘用量 ---
- Disk:
    widget:
      type: glances
      url: http://your-server-ip:32518
      metric: fs:/

# --- 系统运行时间 ---
# 注意：uptime 需要 /api/3/uptime 端点返回字符串
# 我们的 Agent 已实现
